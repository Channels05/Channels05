                        :+=++#    -=#:                                                         
                       %-=+#    -+++-=
          </div>

          <!-- Columna Derecha: Tarjeta de Información -->
          <div class="info-card">
            <div class="line l-1">
              <span class="user-host">felipe@santiago</span>
            </div>
            <div class="line l-2" style="color: #30363d;">----------------------------------</div>
            <div class="line l-3">
              <span class="key">Role:</span> <span class="val">Data Science Engineering Student</span>
            </div>
            <div class="line l-4">
              <span class="key">Focus:</span> <span class="val">Backend &amp; Distributed Data Systems</span>
            </div>
            <div class="line l-5">
              <span class="key">Stack:</span> <span class="highlight">Python, FastAPI, DuckDB, React</span>
            </div>
            <div class="line l-6">
              <span class="key">Hardware:</span> <span class="val">Raspberry Pi 3 (BLE Proximity)</span>
            </div>
            <div class="line l-7">
              <span class="key">Hobbies:</span> <span class="val">Running, 35mm Analog Photography</span>
            </div>
            <div class="line l-8">
              <span class="key">Status:</span> <span class="val">Building projects &amp; training</span><span class="cursor"></span>
            </div>

            <!-- Bloques de color tipo Neofetch -->
            <div class="line l-9 palette">
              <span class="color-block" style="background: #ff7b72;"></span>
              <span class="color-block" style="background: #ffa657;"></span>
              <span class="color-block" style="background: #d29922;"></span>
              <span class="color-block" style="background: #7ee787;"></span>
              <span class="color-block" style="background: #79c0ff;"></span>
              <span class="color-block" style="background: #d2a8ff;"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
